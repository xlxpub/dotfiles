# Lazygit 主配置（XDG 路径，lazygit 会优先读取此文件）
# 主题通过别名 lgs 加载：--use-config-file ~/.config/lazygit-theme/themes-mergable/frappe/sky.yml

# ── Git 行为 ───────────────────────────────
git:
  autoFetch: true           # 定期自动 fetch
  autoRefresh: true
  fetchAll: true
  # 自定义 diff 渲染器，用 '|' / '\' 切换
  diffRenderers:
    - type: rawGit
      name: line-diff
      args: []
    - type: rawGit
      name: word-char-diff
      args: ["--color-words"]

# ── 编辑器与外部命令 ───────────────────────
os:
  # 用 neovim-remote 把编辑请求发给正在运行的 nvim 实例（而不是嵌套一个新 nvim）
  # --remote-wait：等你关掉该 buffer 再回到 lazygit
  # bufhidden=wipe 是必需的：--remote-wait 要等 buffer 被卸载才返回，否则 lazygit 会一直卡住
  # tabnew：在新 tab 里全屏打开文件，:q 关闭后回到带 lazygit 的原 tab
  edit: '$HOME/.local/bin/nvr -cc "tabnew" --remote-wait +''set bufhidden=wipe'' "{{filename}}"'
  editAtLine: '$HOME/.local/bin/nvr -cc "tabnew" --remote-wait +''set bufhidden=wipe'' +{{line}} "{{filename}}"'

# ── 通用界面 ───────────────────────────────
gui:
  nerdFontsVersion: "3"     # 使用 nerd font 图标
  showFileTree: true        # 文件树分组模式（按目录折叠，区分 tracked / untracked）
  showRootItemInFileTree: true  # 文件树显示根节点，分组归属更清晰
  showRandomTip: false
  showCommandLog: true
  promptToReturnFromSubprocess: false  # 外部编辑器返回后不再提示 "Press enter to return to lazygit"
  scrollHeight: 2
  commitLength:
    show: true

# ── 键位 ───────────────────────────────────
keybinding:
  universal:
    quit: "q"
    return: "<esc>"
    cycleDiffRenderers: '|'          # 正序切换 diff 渲染器
    cycleDiffRenderersReverse: '\'   # 逆序切换 diff 渲染器
